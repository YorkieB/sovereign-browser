<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Privacy Search</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;-webkit-font-smoothing:antialiased;
background:#1a1a1a;color:#fff;line-height:1.6;overflow-x:hidden}
.hero-section{height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;
text-align:center;padding:0 20px;position:relative;
background:radial-gradient(ellipse at 30% 20%,#24506b 0%,transparent 55%),
radial-gradient(ellipse at 75% 70%,#1f3a52 0%,transparent 55%),
linear-gradient(160deg,#101820 0%,#1a1a1a 60%,#14202b 100%)}
.hero-content{max-width:600px;margin-bottom:40px}
.hero-title{font-size:3.5rem;font-weight:300;margin-bottom:1rem;text-shadow:2px 2px 4px rgba(0,0,0,.8)}
.hero-subtitle{font-size:1.2rem;opacity:.9;text-shadow:1px 1px 2px rgba(0,0,0,.8)}
.search-box{width:100%;max-width:600px;position:relative}
.main-search-input{width:100%;padding:18px 60px 18px 20px;font-size:18px;border:none;border-radius:30px;
background:rgba(255,255,255,.95);color:#333;box-shadow:0 8px 25px rgba(0,0,0,.3);transition:all .3s ease}
.main-search-input:focus{outline:none;box-shadow:0 8px 35px rgba(0,0,0,.4);background:#fff}
.search-button{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:#0078d4;border:none;
width:44px;height:44px;border-radius:50%;color:#fff;cursor:pointer;font-size:17px;display:flex;
align-items:center;justify-content:center;transition:background .3s ease}
.search-button:hover{background:#106ebe}
.hint{margin-top:18px;font-size:13px;opacity:.55}
.sugg{position:absolute;top:calc(100% + 6px);left:0;right:0;background:#fff;border-radius:14px;
box-shadow:0 10px 30px rgba(0,0,0,.35);overflow:hidden;text-align:left;z-index:20;display:none}
.sugg.open{display:block}
.sugg-item{padding:11px 20px;font-size:15px;color:#222;cursor:pointer;display:flex;gap:10px;align-items:center}
.sugg-item:hover,.sugg-item.active{background:#eef3f7}
.sugg-item .ic{opacity:.45;font-size:13px}
.news-carousel{padding:40px 0;background:#1a1a1a}
.carousel-container,.discover-container{max-width:1400px;margin:0 auto;padding:0 20px}
.carousel-title,.discover-title{font-size:1.8rem;margin-bottom:20px}
.discover-title{font-size:2rem;margin-bottom:30px;text-transform:uppercase;font-weight:700}
.news-cards-container{display:flex;gap:20px;overflow-x:auto;scroll-behavior:smooth;padding-bottom:10px}
.news-card{flex:0 0 300px;height:200px;border-radius:12px;position:relative;cursor:pointer;
transition:transform .3s ease;background:linear-gradient(135deg,#22384a,#2e5069);
background-size:cover;background-position:center;overflow:hidden}
.news-card-fav{position:absolute;top:12px;left:12px;width:26px;height:26px;border-radius:6px;background:rgba(255,255,255,.9);object-fit:contain;padding:3px}
.news-card-meta{color:#cfd6da;font-size:11px;margin-top:4px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.news-card-meta .dot{opacity:.5}
.news-card-age{color:#8fd0a8;font-weight:600}
.feed-status{font-size:12px;color:var(--mut);margin:-8px 0 16px}
.news-card:hover{transform:translateY(-5px)}
.news-card-overlay{position:absolute;bottom:0;left:0;right:0;padding:20px;border-radius:0 0 12px 12px;
background:linear-gradient(transparent,rgba(0,0,0,.85))}
.news-card-title{font-size:16px;font-weight:600;line-height:1.3;margin-bottom:5px}
.news-card-source{color:#ccc;font-size:12px}
.status{font-size:13px;opacity:.55;padding:8px 0}
.discover-section{padding:60px 0 80px;background:#1a1a1a}
.discover-grid{display:grid;grid-template-columns:2fr 1fr 1fr;gap:20px}
.discover-card{border-radius:12px;overflow:hidden;cursor:pointer;position:relative;
transition:transform .3s ease}
.discover-card:hover{transform:scale(1.02)}
.discover-card.large{grid-row:span 2;height:400px}
.discover-card.medium{height:190px}
.discover-card-content{position:absolute;bottom:0;left:0;right:0;padding:20px;
background:linear-gradient(transparent,rgba(0,0,0,.8))}
.discover-card-title{font-size:18px;font-weight:600;margin-bottom:8px;line-height:1.3}
.discover-card-subtitle{font-size:14px;opacity:.8}
.g1{background:linear-gradient(140deg,#1f4d5f,#3a7d8c)}
.g2{background:linear-gradient(140deg,#31405e,#4e6591)}
.g3{background:linear-gradient(140deg,#5a3550,#8a5077)}
.g4{background:linear-gradient(140deg,#2c5545,#468a6a)}
.g5{background:linear-gradient(140deg,#5d4a2b,#94764a)}
@media(max-width:1200px){.discover-grid{grid-template-columns:1fr 1fr}}
@media(max-width:768px){.hero-title{font-size:2.5rem}.discover-grid{grid-template-columns:1fr}
.discover-card.large{grid-row:auto;height:220px}.news-card{flex:0 0 250px}}
</style>
</head>
<body>

<section class="hero-section">
  <div class="hero-content">
    <h1 class="hero-title">Privacy Search</h1>
    <p class="hero-subtitle">Fast, unbiased search results with no tracking and positive news</p>
  </div>
  <form class="search-box" id="searchForm" autocomplete="off">
    <input type="text" class="main-search-input" id="q"
           placeholder="Search the web privately..." aria-label="Search" autofocus>
    <button type="submit" class="search-button" aria-label="Search">&#8250;</button>
    <div class="sugg" id="sugg" role="listbox"></div>
  </form>
  <p class="hint">Local file. Type a URL to go straight there.</p>
</section>

<section class="news-carousel" id="newsSection" hidden>
  <div class="carousel-container">
    <h2 class="carousel-title">Trending positive news</h2>
    <div class="feed-status" id="feedStatus"></div>
    <div class="news-cards-container" id="newsCards"></div>
    <div class="status" id="newsStatus"></div>
  </div>
</section>

<section class="discover-section">
  <div class="discover-container">
    <h2 class="discover-title">Discover</h2>
    <div class="discover-grid" id="discoverGrid"></div>
  </div>
</section>

<script>
var SEARCH_URL = "https://search.brave.com/search?q=";
var API_BASE = "http://localhost:3001";
var NEWS_TIMEOUT_MS = 2500;

function go(url) { window.location.href = url; }

function runSearch(value) {
  var v = (value || "").trim();
  if (!v) { return; }
  var looksLikeUrl = /^https?:\/\//i.test(v) || /^[\w-]+(\.[\w-]+)+([\/?#]|$)/.test(v);
  if (looksLikeUrl) {
    go(/^https?:\/\//i.test(v) ? v : "https://" + v);
  } else {
    go(SEARCH_URL + encodeURIComponent(v));
  }
}

document.getElementById("searchForm").addEventListener("submit", function (e) {
  e.preventDefault();
  closeSugg();
  runSearch(document.getElementById("q").value);
});

var qInput = document.getElementById("q");
var suggBox = document.getElementById("sugg");
var suggItems = [];
var suggIndex = -1;
var suggTimer = null;

function closeSugg() {
  suggBox.classList.remove("open");
  suggBox.textContent = "";
  suggItems = [];
  suggIndex = -1;
}

function highlight(n) {
  var nodes = suggBox.querySelectorAll(".sugg-item");
  for (var i = 0; i < nodes.length; i++) { nodes[i].classList.toggle("active", i === n); }
  suggIndex = n;
}

function drawSugg(list) {
  suggBox.textContent = "";
  if (!list.length) { closeSugg(); return; }
  suggItems = list;
  list.forEach(function (text, i) {
    var row = document.createElement("div");
    row.className = "sugg-item";
    row.setAttribute("role", "option");
    var ic = document.createElement("span");
    ic.className = "ic";
    ic.textContent = "\u2315";
    var label = document.createElement("span");
    label.textContent = text;
    row.appendChild(ic);
    row.appendChild(label);
    row.addEventListener("mouseenter", function () { highlight(i); });
    row.addEventListener("mousedown", function (ev) {
      ev.preventDefault();
      closeSugg();
      runSearch(text);
    });
    suggBox.appendChild(row);
  });
  suggBox.classList.add("open");
  suggIndex = -1;
}

function fetchSugg(query) {
  var controller = new AbortController();
  var timer = setTimeout(function () { controller.abort(); }, 1500);
  fetch(API_BASE + "/api/suggest?q=" + encodeURIComponent(query), { signal: controller.signal })
    .then(function (r) {
      if (!r.ok) { throw new Error("suggest " + r.status); }
      return r.json();
    })
    .then(function (data) {
      if (qInput.value.trim() !== query) { return; }
      drawSugg(Array.isArray(data.results) ? data.results.slice(0, 7) : []);
    })
    .catch(function (err) {
      if (err.name !== "AbortError") { console.warn("[home] suggest unavailable:", err.message); }
      closeSugg();
    })
    .finally(function () { clearTimeout(timer); });
}

qInput.addEventListener("input", function () {
  var v = qInput.value.trim();
  clearTimeout(suggTimer);
  if (v.length < 2) { closeSugg(); return; }
  suggTimer = setTimeout(function () { fetchSugg(v); }, 250);
});

qInput.addEventListener("keydown", function (e) {
  if (!suggBox.classList.contains("open")) { return; }
  if (e.key === "ArrowDown") {
    e.preventDefault();
    highlight(suggIndex + 1 >= suggItems.length ? 0 : suggIndex + 1);
  } else if (e.key === "ArrowUp") {
    e.preventDefault();
    highlight(suggIndex - 1 < 0 ? suggItems.length - 1 : suggIndex - 1);
  } else if (e.key === "Enter") {
    if (suggIndex >= 0) {
      e.preventDefault();
      var chosen = suggItems[suggIndex];
      closeSugg();
      runSearch(chosen);
    }
  } else if (e.key === "Escape") {
    closeSugg();
  }
});

qInput.addEventListener("blur", function () { setTimeout(closeSugg, 120); });

var DISCOVER = [
  { title: "Privacy Matters", subtitle: "Latest developments in digital privacy", size: "large",  tone: "g1" },
  { title: "Technology News", subtitle: "Breaking tech stories",                  size: "medium", tone: "g2" },
  { title: "Security Updates", subtitle: "Stay protected online",                 size: "medium", tone: "g3" },
  { title: "Science",          subtitle: "Latest discoveries",                    size: "medium", tone: "g4" },
  { title: "Environment",      subtitle: "Green initiatives",                     size: "medium", tone: "g5" }
];

(function buildDiscover() {
  var grid = document.getElementById("discoverGrid");
  DISCOVER.forEach(function (card) {
    var el = document.createElement("div");
    el.className = "discover-card " + card.size + " " + card.tone;
    var content = document.createElement("div");
    content.className = "discover-card-content";
    var h3 = document.createElement("h3");
    h3.className = "discover-card-title";
    h3.textContent = card.title;
    var p = document.createElement("p");
    p.className = "discover-card-subtitle";
    p.textContent = card.subtitle;
    content.appendChild(h3);
    content.appendChild(p);
    el.appendChild(content);
    el.addEventListener("click", function () { runSearch(card.title); });
    grid.appendChild(el);
  });
})();

function parseBraveDate(s) {
  if (!s) { return null; }
  var m = String(s).match(/^(\d{2})\/(\d{2})\/(\d{4})\s+(\d{2}):(\d{2}):(\d{2})$/);
  if (m) { return new Date(+m[3], +m[1] - 1, +m[2], +m[4], +m[5], +m[6]); }
  var d = new Date(s);
  return isNaN(d.getTime()) ? null : d;
}

function relativeAge(date) {
  if (!date) { return null; }
  var mins = Math.round((Date.now() - date.getTime()) / 60000);
  if (mins < 1) { return "just now"; }
  if (mins < 60) { return mins + "m ago"; }
  var hrs = Math.round(mins / 60);
  if (hrs < 24) { return hrs + "h ago"; }
  var days = Math.round(hrs / 24);
  return days + "d ago";
}

function clockLabel(date) {
  if (!date) { return null; }
  var hh = String(date.getHours()).padStart(2, "0");
  var mm = String(date.getMinutes()).padStart(2, "0");
  var months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return hh + ":" + mm + ", " + date.getDate() + " " + months[date.getMonth()];
}

function renderNews(articles) {
  var wrap = document.getElementById("newsCards");
  wrap.textContent = "";

  articles.forEach(function (a) {
    var when = parseBraveDate(a.publishedAt);

    var card = document.createElement("div");
    card.className = "news-card";
    if (a.thumbnail) {
      card.style.backgroundImage =
        "linear-gradient(rgba(0,0,0,.15), rgba(0,0,0,.35)), url('" + a.thumbnail + "')";
    } else if (a.favicon) {
      var fav = document.createElement("img");
      fav.className = "news-card-fav";
      fav.src = a.favicon;
      fav.alt = "";
      fav.addEventListener("error", function () { fav.remove(); });
      card.appendChild(fav);
    }

    var overlay = document.createElement("div");
    overlay.className = "news-card-overlay";

    var h3 = document.createElement("h3");
    h3.className = "news-card-title";
    h3.textContent = a.title || "Untitled";
    overlay.appendChild(h3);

    var meta = document.createElement("div");
    meta.className = "news-card-meta";

    var age = document.createElement("span");
    age.className = "news-card-age";
    age.textContent = relativeAge(when) || a.published || "";
    if (age.textContent) { meta.appendChild(age); }

    var stamp = clockLabel(when);
    if (stamp) {
      var d1 = document.createElement("span"); d1.className = "dot"; d1.textContent = "|";
      var t = document.createElement("span"); t.textContent = stamp;
      meta.appendChild(d1); meta.appendChild(t);
    }

    if (a.source) {
      var d2 = document.createElement("span"); d2.className = "dot"; d2.textContent = "|";
      var s = document.createElement("span"); s.textContent = String(a.source).replace(/^www\./, "");
      meta.appendChild(d2); meta.appendChild(s);
    }

    overlay.appendChild(meta);
    card.appendChild(overlay);
    if (a.url) { card.addEventListener("click", function () { go(a.url); }); }
    wrap.appendChild(card);
  });
}

(function loadNews() {
  var section = document.getElementById("newsSection");
  var status = document.getElementById("feedStatus");
  var controller = new AbortController();
  var timer = setTimeout(function () { controller.abort(); }, NEWS_TIMEOUT_MS);

  fetch(API_BASE + "/api/news?q=positive+news&count=12", { signal: controller.signal })
    .then(function (r) {
      if (!r.ok) { throw new Error("Search service returned " + r.status); }
      return r.json();
    })
    .then(function (data) {
      var results = (data && data.results) || [];
      if (!results.length) { throw new Error("No articles returned"); }

      results.sort(function (x, y) {
        var dx = parseBraveDate(x.publishedAt);
        var dy = parseBraveDate(y.publishedAt);
        if (dx && dy) { return dy - dx; }
        if (dy) { return 1; }
        if (dx) { return -1; }
        return 0;
      });

      section.hidden = false;
      renderNews(results);

      var newest = parseBraveDate(results[0] && results[0].publishedAt);
      var bits = ["Fetched " + clockLabel(new Date())];
      if (newest) { bits.push("newest story " + relativeAge(newest)); }
      if (data.cached) { bits.push("served from cache"); }
      status.textContent = bits.join("  |  ");
    })
    .catch(function (err) {
      console.warn("[home] news unavailable:", err && err.message);
      section.hidden = true;
    })
    .finally(function () { clearTimeout(timer); });
})();
</script>
</body>
</html>
