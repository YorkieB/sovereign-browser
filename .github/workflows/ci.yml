# ci.yml - proof-on-every-push for Sovereign/holly.
# Mirrors the sandbox-proven layers: syntax check, headless Electron smoke,
# and the Testcontainers integration test. Display deps mirror .devcontainer/Dockerfile.
# The apt line resolves t64 package names (ubuntu 24.04) vs pre-t64 (22.04) at runtime.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Electron display deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth libnss3 libgbm1 \
            $(apt-cache show libasound2t64 >/dev/null 2>&1 \
              && echo libasound2t64 libgtk-3-0t64 \
              || echo libasound2 libgtk-3-0)
      - run: npm ci --no-audit --no-fund
      - name: Headless smoke
        run: xvfb-run -a npx electron . --smoke-test --no-sandbox

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Electron display deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth libnss3 libgbm1 \
            $(apt-cache show libasound2t64 >/dev/null 2>&1 \
              && echo libasound2t64 libgtk-3-0t64 \
              || echo libasound2 libgtk-3-0)
      - run: npm ci --no-audit --no-fund
      - name: Integration (Testcontainers nginx + Electron page load)
        run: xvfb-run -a npm run test:integration
