# ci.yml - proof-on-every-push for Sovereign/holly.
# Mirrors the sandbox-proven layers: syntax check, headless Electron smoke,
# and the Testcontainers integration test. Display deps mirror .devcontainer/Dockerfile.
# The apt line resolves t64 package names (ubuntu 24.04) vs pre-t64 (22.04) at runtime.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Electron display deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth libnss3 libgbm1 \
            $(apt-cache show libasound2t64 >/dev/null 2>&1 \
              && echo libasound2t64 libgtk-3-0t64 \
              || echo libasound2 libgtk-3-0)
      - run: npm ci --no-audit --no-fund
      - name: Headless smoke
        run: xvfb-run -a npx electron . --smoke-test --no-sandbox

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Electron display deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth libnss3 libgbm1 \
            $(apt-cache show libasound2t64 >/dev/null 2>&1 \
              && echo libasound2t64 libgtk-3-0t64 \
              || echo libasound2 libgtk-3-0)
      - run: npm ci --no-audit --no-fund
      - name: Integration (Testcontainers nginx + Electron page load)
        run: xvfb-run -a npm run test:integration

  supply-chain:
    # Supply-chain layer: Docker Scout scans the dependency tree for CVEs.
    # Fails the build on CRITICAL vulnerabilities in npm packages we control.
    # Highs and Go-stdlib CVEs (baked into electron-builder binaries, unfixable
    # from package.json) are printed for triage but do not block.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Authenticate to Docker Hub (Scout entitlement)
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Full CVE report (all package types, non-blocking)
        uses: docker/scout-action@v1
        with:
          command: cves
          image: fs://.
          only-severities: critical,high
          exit-code: false
          dockerhub-user: ${{ secrets.DOCKERHUB_USER }}
          dockerhub-password: ${{ secrets.DOCKERHUB_TOKEN }}
          organization: ${{ secrets.DOCKERHUB_USER }}
      - name: Gate on critical npm CVEs (blocking)
        uses: docker/scout-action@v1
        with:
          command: cves
          image: fs://.
          only-severities: critical
          only-package-types: npm
          exit-code: true
          dockerhub-user: ${{ secrets.DOCKERHUB_USER }}
          dockerhub-password: ${{ secrets.DOCKERHUB_TOKEN }}
          organization: ${{ secrets.DOCKERHUB_USER }}

  release:
    # Provenance layer: build the Windows artifacts, sign a SLSA attestation over
    # them via Sigstore (keyless, GitHub OIDC), then re-verify before finishing.
    # Runs only after the three proof jobs pass, and only on pushes to main.
    needs: [check, smoke, integration]
    if: github.event_name == 'push'
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write        # OIDC token used by Sigstore to sign
      attestations: write    # write the attestation to the repo
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build Windows artifacts
        run: npm run build
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.exe
      - name: Verify attestation on the built artifacts
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist/*.exe | Select-Object -First 1
          gh attestation verify $exe.FullName --repo $env:GITHUB_REPOSITORY
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: holly-windows
          path: dist/*.exe
